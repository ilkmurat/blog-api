openapi: 3.1.0
info:
  title: Inkwell Blog API
  version: 0.3.0
  description: >
    Backend for the Inkwell blog. Posts, categories and tags are stored in PostgreSQL;
    post embeddings are stored in Qdrant to power semantic search.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Service and dependency health
      operationId: health
      responses:
        "200":
          description: All dependencies reachable
          content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } }
        "503":
          description: One or more dependencies unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } }
  /api/v1/posts:
    get:
      summary: List posts (newest first)
      operationId: listPosts
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
        - { name: category, in: query, description: Category slug, schema: { type: string } }
        - { name: tag, in: query, description: Tag slug, schema: { type: string } }
        - { name: q, in: query, description: Case-insensitive keyword match on title/excerpt/content, schema: { type: string } }
      responses:
        "200":
          description: A page of posts
          content: { application/json: { schema: { $ref: "#/components/schemas/PostPage" } } }
    post:
      summary: Create a post
      description: Category and tags are referenced by name and created if they don't exist. The post is indexed in Qdrant.
      operationId: createPost
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PostCreate" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/posts/search:
    get:
      summary: Semantic search over posts (Qdrant)
      operationId: searchPosts
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 5 } }
      responses:
        "200":
          description: Posts ranked by similarity
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/posts/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a post
      description: When called with a member token, `liked_by_me` reflects that member's like.
      operationId: getPost
      security: [{}, { bearerAuth: [] }]
      responses:
        "200":
          description: The post
          content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Partially update a post
      operationId: updatePost
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PostUpdate" } } }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      summary: Delete a post (also removes its vector)
      operationId: deletePost
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/posts/{slug}/like:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      summary: Like a post
      description: >
        Anonymous callers may like any number of times (each call adds one like).
        Members (bearer token) count at most once per post; repeat calls are idempotent and leave the count unchanged.
      operationId: likePost
      security: [{}, { bearerAuth: [] }]
      responses:
        "200":
          description: Current like state
          content: { application/json: { schema: { $ref: "#/components/schemas/LikeResult" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/categories:
    get:
      summary: List categories with post counts
      operationId: listCategories
      responses:
        "200":
          description: Categories
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TermWithCount" } } } }
    post:
      summary: Create a category (admin)
      operationId: createCategory
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TermCreate" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/TermWithCount" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/tags:
    get:
      summary: List tags with post counts
      operationId: listTags
      responses:
        "200":
          description: Tags
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TermWithCount" } } } }
    post:
      summary: Create a tag (admin)
      operationId: createTag
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TermCreate" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/TermWithCount" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/auth/register:
    post:
      summary: Sign up as a member
      description: No format validation; username and email must be unique.
      operationId: register
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UserCreate" } } }
      responses:
        "201":
          description: Registered and logged in
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/auth/login:
    post:
      summary: Log in
      operationId: login
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } }
      responses:
        "200":
          description: Logged in
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/auth/logout:
    post:
      summary: Log out (revokes the current token)
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/me:
    get:
      summary: Current user
      operationId: me
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The logged-in user
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/users:
    get:
      summary: List users (admin)
      operationId: listUsers
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Users
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Create a user (admin)
      operationId: createUser
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserCreate" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/hr/documents:
    get:
      summary: List HR documents (admin)
      operationId: listHrDocuments
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Documents, newest first
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/HrDocument" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Upload an HR document (admin)
      description: >
        Accepts a text-based PDF (max 20 MB). Returns immediately with status `processing`; text extraction,
        chunking and embedding (multilingual-e5-large) run in the background and the status becomes `ready`
        or `failed` (see `error`). Scanned PDFs without a text layer fail with "no extractable text".
      operationId: uploadHrDocument
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: PDF file }
                title: { type: string, maxLength: 200, description: Defaults to the file name without extension }
                topic: { type: string, maxLength: 100, description: "Free-form subject, e.g. İzin, Yan Haklar. Defaults to Genel" }
      responses:
        "202":
          description: Accepted for processing
          content: { application/json: { schema: { $ref: "#/components/schemas/HrDocument" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: File larger than 20 MB
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "415":
          description: Not a PDF
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/hr/documents/{document_id}:
    parameters:
      - { name: document_id, in: path, required: true, schema: { type: integer } }
    get:
      summary: Get one HR document's status (admin)
      operationId: getHrDocument
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The document
          content: { application/json: { schema: { $ref: "#/components/schemas/HrDocument" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete an HR document and its vectors (admin)
      operationId: deleteHrDocument
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token from /api/v1/auth/login or /api/v1/auth/register
  responses:
    Unauthorized:
      description: Missing, invalid or expired token / wrong credentials
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Admin role required
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Slug, username or email already in use
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ValidationError:
      description: Request failed validation
      content: { application/json: { schema: { type: object, properties: { detail: { type: array, items: { type: object } } } } } }
  schemas:
    Error:
      type: object
      required: [detail]
      properties: { detail: { type: string } }
    Health:
      type: object
      required: [status, postgres, qdrant]
      properties:
        status: { type: string, enum: [ok, degraded] }
        postgres: { type: string, enum: [ok, error] }
        qdrant: { type: string, enum: [ok, error] }
    Term:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
    TermWithCount:
      allOf:
        - $ref: "#/components/schemas/Term"
        - type: object
          required: [post_count]
          properties: { post_count: { type: integer } }
    PostCreate:
      type: object
      required: [title, content, category]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", description: Derived from title when omitted }
        excerpt: { type: string, maxLength: 500 }
        content: { type: string, minLength: 1, description: Markdown }
        author: { type: string, default: Anonymous }
        category: { type: string, minLength: 1, description: Category name }
        tags: { type: array, items: { type: string, minLength: 1 }, default: [] }
        published_at: { type: string, format: date-time, description: Defaults to now }
    PostUpdate:
      type: object
      description: Any subset of PostCreate fields
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        excerpt: { type: string, maxLength: 500 }
        content: { type: string, minLength: 1 }
        author: { type: string }
        category: { type: string, minLength: 1 }
        tags: { type: array, items: { type: string, minLength: 1 } }
        published_at: { type: string, format: date-time }
    PostSummary:
      type: object
      required: [id, slug, title, excerpt, author, category, tags, published_at, reading_time, like_count]
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        author: { type: string }
        category: { $ref: "#/components/schemas/Term" }
        tags: { type: array, items: { $ref: "#/components/schemas/Term" } }
        published_at: { type: string, format: date-time }
        reading_time: { type: integer, description: Minutes }
        like_count: { type: integer }
    Post:
      allOf:
        - $ref: "#/components/schemas/PostSummary"
        - type: object
          required: [content, created_at, updated_at, liked_by_me]
          properties:
            content: { type: string }
            liked_by_me: { type: boolean, description: Always false for anonymous callers }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    PostPage:
      type: object
      required: [items, total, page, page_size, pages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PostSummary" } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        pages: { type: integer }
    SearchHit:
      type: object
      required: [score, post]
      properties:
        score: { type: number }
        post: { $ref: "#/components/schemas/PostSummary" }
    TermCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    LikeResult:
      type: object
      required: [like_count, liked_by_me]
      properties:
        like_count: { type: integer }
        liked_by_me: { type: boolean }
    UserCreate:
      type: object
      required: [username, email, first_name, last_name, password]
      properties:
        username: { type: string }
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        password: { type: string, writeOnly: true }
    AdminUserCreate:
      allOf:
        - $ref: "#/components/schemas/UserCreate"
        - type: object
          properties:
            is_admin: { type: boolean, default: false }
    User:
      type: object
      required: [id, username, email, first_name, last_name, is_admin, created_at]
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        is_admin: { type: boolean }
        created_at: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, writeOnly: true }
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }
    HrDocument:
      type: object
      required: [id, title, topic, filename, size_bytes, pages, chunk_count, status, error, uploaded_by, created_at]
      properties:
        id: { type: integer }
        title: { type: string }
        topic: { type: string }
        filename: { type: string }
        size_bytes: { type: integer }
        pages: { type: integer, description: 0 until processed }
        chunk_count: { type: integer, description: Number of indexed passages; 0 until processed }
        status: { type: string, enum: [processing, ready, failed] }
        error: { type: [string, "null"] }
        uploaded_by: { type: [string, "null"], description: Username of the uploader }
        created_at: { type: string, format: date-time }
